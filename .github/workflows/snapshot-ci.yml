# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: WildFly Galleon feature-packs for Glow - PR and Nightly CI to test against WildFly SNAPSHOT build

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    branches:
      - 'release'
    types: [opened, synchronize, reopened, ready_for_review]
env:
  WILDFLY_GLOW: https://github.com/wildfly/wildfly-glow/releases/download/2.0.0.Beta2/wildfly-glow-2.0.0.Beta2.zip
jobs:
  build:
    name: ${{ matrix.os }}-jdk${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['17', '21']

    steps:
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: wildfly-extras/wildfly-nightly-download@v1
        id: wildfly-nightly
      - uses: actions/checkout@v5
      - name: Download wildfly-glow
        run: |
          wget ${{ env.WILDFLY_GLOW }}
          unzip wildfly-glow*.zip -d .
          glowDir=$(find $PWD -type d -iname "wildfly-glow*")
          echo "WILDFLY_GLOW_DIR=$glowDir" >> "$GITHUB_ENV"
      - name: Test
        run: |
          version=${{steps.wildfly-nightly.outputs.wildfly-version}}
          echo "Testing with WildFly version $version"
          bash tests/run-wildfly-glow-tests.sh $version
        shell: bash